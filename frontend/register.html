<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - lm3alm.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><a href="/" style="text-decoration: none; color: white;">lm3alm.com</a></h1>
    </header>
    <main>
        <section id="register-section">
            <h2>Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Register as:</label>
                    <input type="radio" id="passenger" name="role" value="passenger" checked>
                    <label for="passenger">Passenger</label>
                    <input type="radio" id="driver" name="role" value="driver">
                    <label for="driver">Driver</label>
                </div>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </section>
    </main>
    <script src="register.js"></script>
</body>
</html>
